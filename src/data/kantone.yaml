# Grunddaten der 26 Kantone. Reihenfolge und Nummer wie in der Bundesverfassung (Art. 1) und im BFS-Gemeindeverzeichnis.
# Jede Angabe nennt ihre Quelle (Schlüssel in `quellen`). `ungeprueft: true` heisst: noch nicht gegen die Quelle geprüft;
# die Website zeigt solche Angaben markiert an. Alle Felder geprüft am 19.10.2026 (BV Art. 1, HLS, Kanton AR).
geprueft_am: 2026-10-19

quellen:
  bv:
    titel: Bundesverfassung der Schweizerischen Eidgenossenschaft (SR 101)
    url: https://www.fedlex.admin.ch/eli/cc/1999/404/de
    artikel: Art. 1
  bfs_agv:
    titel: BFS, Amtliches Gemeindeverzeichnis der Schweiz
    url: https://www.agvchapp.bfs.admin.ch/de/state/query
  hls:
    titel: Historisches Lexikon der Schweiz (HLS), Artikel zu den Kantonen
    url: https://hls-dhs-dss.ch/de/
  ar_hauptort:
    titel: Kanton Appenzell Ausserrhoden, Themenblatt «Hauptort des Kantons» (2019)
    url: https://www.ar.ch/fileadmin/user_upload/Regierungsrat/Kantonsverfassung/Themenblaetter/Arbeitsgruppe_1/Themenblatt_112_Hauptort_des_Kantons_Weiterverwendung_nach_Plenum_25042019.pdf

# nr: BFS-Kantonsnummer. beitritt: Jahr des Eintritts in die Eidgenossenschaft.
# sprachen: Amtssprachen des Kantons (de, fr, it, rm).
